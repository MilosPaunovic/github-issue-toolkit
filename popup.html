<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Issue Toolkit</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --bg-hover: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --text-secondary: #59636e;
      --accent: #0969da;
      --accent-hover: #0860ca;
      --off: #8c959f;
      --green: #1a7f37;
      --red: #d1242f;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161b22;
        --bg-hover: #1c2128;
        --border: #30363d;
        --text: #e6edf3;
        --text-secondary: #8b949e;
        --accent: #58a6ff;
        --accent-hover: #79b8ff;
        --off: #6e7681;
        --green: #3fb950;
        --red: #f85149;
      }
    }
    * { box-sizing: border-box; }
    .only-dark { display: none; }
    @media (prefers-color-scheme: dark) { .only-dark { display: block; } .only-light { display: none; } }
    body { margin: 0; width: 340px; background: var(--bg); color: var(--text); font: 13px/1.4 var(--font-sans); }
    header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    header img { width: 28px; height: 28px; border-radius: 7px; }
    header h1 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.2; }
    header .sub { color: var(--text-secondary); font-size: 12px; }
    h2 { margin: 0; padding: 10px 14px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); }
    label.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 14px; cursor: pointer; }
    label.row:hover { background: var(--bg-hover); }
    label.row span { min-width: 0; }
    .switch { position: relative; flex: 0 0 auto; width: 28px; height: 16px; margin: 0; appearance: none; -webkit-appearance: none; border-radius: 8px; background: var(--off); cursor: pointer; transition: background .15s; }
    .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .switch:checked { background: var(--accent); }
    .switch:checked::after { transform: translateX(12px); }
    .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #access { margin: 10px 14px 0; padding: 10px 12px; border: 1px solid var(--accent); border-radius: 8px; color: var(--text-secondary); }
    #access p { margin: 0 0 8px; }
    footer { margin-top: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #token-state { font-size: 12px; color: var(--text-secondary); }
    #token-state.ok { color: var(--green); }
    #token-state.missing { color: var(--red); }
    button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-hover); color: var(--text); font: 600 12px var(--font-sans); cursor: pointer; }
    button:hover { border-color: var(--text-secondary); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  </style>
</head>
<body>
  <header>
    <img class="only-dark" src="icons/icon-dark-128.png" alt="">
    <img class="only-light" src="icons/icon-light-128.png" alt="">
    <div>
      <h1>GitHub Issue Toolkit</h1>
      <div class="sub">Quick settings</div>
    </div>
  </header>
  <div id="access" hidden>
    <p>This browser has not granted the extension access to github.com yet.</p>
    <button id="grant" type="button" class="primary">Allow access to github.com</button>
  </div>
  <main id="groups"></main>
  <footer>
    <span id="token-state"></span>
    <button id="more" type="button" class="primary">All settings</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
