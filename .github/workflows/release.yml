name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          chrome="$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")"
          firefox="$(python3 -c "import json;print(json.load(open('manifest.firefox.json'))['version'])")"
          echo "tag=$tag manifest.json=$chrome manifest.firefox.json=$firefox"
          [ "$tag" = "$chrome" ] && [ "$tag" = "$firefox" ] || { echo "Tag and manifest versions differ"; exit 1; }

      - name: Build the packages
        run: OUT_DIR="$RUNNER_TEMP/dist" scripts/package.sh

      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" > "$RUNNER_TEMP/notes.md" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\Z)", text, re.S | re.M)
          print(m.group(1).strip() if m else f"Release {version}. See CHANGELOG.md.")
          PY
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
